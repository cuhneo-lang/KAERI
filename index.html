<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물품 관리</title>
<meta name="apple-mobile-web-app-title" content="물품 관리">
<meta name="application-name" content="물품 관리">
<meta name="theme-color" content="#f6eede">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<script>
  // 실제 앱(구글 Apps Script 웹 앱) 주소
  var APP = "https://script.google.com/macros/s/AKfycbzhcNcADLpum__nTuUta1Y8kJ5GqMshbMAbBHWnFeuGbFe5QI3Jh4lm-HPQCyQ4ekGXcQ/exec";
  // 홈 화면 아이콘으로 열면 주소 끝에 ?app 이 붙어 있어 바로 앱으로 넘어감
  if (/[?&]app\b/.test(location.search)) location.replace(APP);
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f3f4f2;color:#333}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  h1{margin:4px 0 0;font-size:20px}
  p{margin:0;font-size:14px;color:#666;line-height:1.6}
  .go{display:inline-block;margin-top:6px;padding:12px 26px;border-radius:12px;background:#2367b0;color:#fff;font-weight:700;text-decoration:none}
  @media (prefers-color-scheme: dark){body{background:#17191b;color:#ddd}p{color:#aaa}}
</style>
</head>
<body>
<img src="icon-192.png" alt="">
<h1>연구실 물품 관리</h1>
<p>지금 이 화면에서 <b>홈 화면에 추가</b>하면<br>다음부터는 아이콘을 누르자마자 앱이 열려요.</p>
<p>아이폰: 공유 버튼 → 홈 화면에 추가<br>갤럭시: 오른쪽 위 ⋮ → 홈 화면에 추가</p>
<a class="go" id="go" href="#">앱 열기</a>
<script>
  document.getElementById("go").href = APP;
  // 아이폰은 '지금 주소'를 아이콘에 저장하므로 ?app 을 미리 붙여 둠
  try { history.replaceState(null, "", location.pathname + "?app"); } catch (e) {}
</script>
</body>
</html>
